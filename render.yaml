# Render Blueprint - deploys the LocateMe backend and frontend as separate services.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------- Backend API (FastAPI) ----------
  - type: web
    name: locateme-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ---------- Frontend (React + Vite static site) ----------
  - type: web
    name: locateme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    # SPA fallback: serve index.html for client-side routes like /admin/login,
    # /home, etc. Existing static assets are still served directly.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
